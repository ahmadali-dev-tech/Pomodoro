<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14181D" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Pomodoro</title>
    <script>
      // Apply the saved theme before first paint so there is no flash of the wrong mode.
      try {
        var s = (JSON.parse(localStorage.getItem('pomodoro-ui') || '{}').state) || {};
        var t = s.theme || 'dark';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var r = document.documentElement;
        r.className = t;
        r.dataset.preset = s.themePreset || 'midnight';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
